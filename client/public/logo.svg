<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="gradBurgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0E1B"/>
      <stop offset="50%" stop-color="#722338"/>
      <stop offset="100%" stop-color="#8B263E"/>
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5C8"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Emblem Icon -->
  <g transform="translate(10, 10)">
    <!-- Shield / Badge Base -->
    <path d="M50 5 L90 20 L90 60 C90 85 50 98 50 98 C50 98 10 85 10 60 L10 20 Z" fill="url(#gradBurgundy)" filter="url(#shadow)"/>
    <path d="M50 9 L84 22 L84 57 C84 79 50 90 50 90 C50 90 16 79 16 57 L16 22 Z" fill="none" stroke="url(#gradGold)" stroke-width="2"/>
    
    <!-- Open Book Symbol -->
    <path d="M28 55 C35 50 45 52 50 56 C55 52 65 50 72 55 L72 75 C65 70 55 72 50 75 C45 72 35 70 28 75 Z" fill="#FFFFFF"/>
    <path d="M50 56 L50 75" stroke="#722338" stroke-width="2"/>
    
    <!-- Graduation Cap / Rays -->
    <polygon points="50,22 75,32 50,42 25,32" fill="url(#gradGold)"/>
    <polygon points="50,42 68,34.8 68,44 50,51" fill="#D4AF37"/>
    <circle cx="50" cy="22" r="3" fill="#FFFFFF"/>
    
    <!-- Star of Excellence -->
    <polygon points="50,6 52,11 57,11 53,14 55,19 50,16 45,19 47,14 43,11 48,11" fill="url(#gradGold)"/>
  </g>
  
  <!-- Brand Typography -->
  <g transform="translate(115, 20)">
    <!-- Main Title -->
    <text x="0" y="38" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#3B0E1B" letter-spacing="-0.5">
      The <tspan fill="#722338">ShED</tspan> <tspan fill="#D4AF37">Forum</tspan>
    </text>
    
    <!-- Subtitle / Full Expansion -->
    <text x="0" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#644941" letter-spacing="0.5">
      SHERSHAHBADI EDUCATIONAL DIALOGUE FORUM
    </text>
    
    <!-- Motto Banner -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="280" height="20" rx="4" fill="#3B0E1B"/>
      <text x="140" y="14" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#D4AF37" text-anchor="middle" letter-spacing="3">
        EDUCATE • EMPOWER • EXCEL
      </text>
    </g>
  </g>
</svg>
